# Intégration et déploiement continus de Lisière.
#
#   test    : tests backend (unitaires + intégration sur PostgreSQL),
#             lint et build React, validation des fichiers Compose
#   build   : images Docker publiées dans le registre GitLab (branche main)
#   deploy  : mise à jour de l'instance AWS EC2, déclenchée à la main
#
# Variables CI/CD à définir dans GitLab (Settings > CI/CD > Variables)
# pour le déploiement : voir docs/CI_CD.md.

stages:
  - test
  - build
  - deploy

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

# ─────────────────────────── test ───────────────────────────

backend_tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_DB: "daar_test"
    POSTGRES_USER: "daar_test"
    POSTGRES_PASSWORD: "ci_test_only"
    DB_HOST: "db"
    DB_PORT: "5432"
    DB_NAME: "daar_test"
    DB_USER: "daar_test"
    DB_PASSWORD: "ci_test_only"
    # Active les tests d'intégration (base jetable du job).
    DAAR_TEST_DB: "1"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]
  script:
    - cd backend
    - python -m pip install -r requirements-dev.txt
    - python -m pytest tests/ -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

frontend_lint_build:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 1 week

compose_config:
  stage: test
  image: docker:27-cli
  variables:
    POSTGRES_PASSWORD: "verification_ci"
  script:
    # Erreur de syntaxe ou de surcharge => échec du pipeline.
    - docker compose -f compose.yaml config -q
    - docker compose -f compose.yaml -f compose.aws.yaml config -q

# ─────────────────────────── build ───────────────────────────

.docker:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build_backend_image:
  extends: .docker
  stage: build
  needs: [backend_tests]
  script:
    - docker build --build-arg INSTALL_DEV_DEPS=0
        -t "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$BACKEND_IMAGE:latest" backend
    - docker push --all-tags "$BACKEND_IMAGE"

build_frontend_image:
  extends: .docker
  stage: build
  needs: [frontend_lint_build]
  script:
    - docker build -t "$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$FRONTEND_IMAGE:latest" frontend
    - docker push --all-tags "$FRONTEND_IMAGE"

# ─────────────────────────── deploy ───────────────────────────

deploy_aws:
  stage: deploy
  image: alpine:3.20
  needs: [build_backend_image, build_frontend_image, compose_config]
  environment:
    name: production
    url: https://13.61.8.67/
  rules:
    # Manuel, et seulement si l'accès SSH au serveur est configuré.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $EC2_HOST && $EC2_SSH_KEY
      when: manual
  variables:
    EC2_USER: "admin"
    DEPLOY_DIR: "/home/admin/daar-release-3ae4534"
  before_script:
    - apk add --no-cache openssh-client
    - chmod 600 "$EC2_SSH_KEY"
    - mkdir -p ~/.ssh && printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - export SSH_TARGET="$EC2_USER@$EC2_HOST"
    # Fichiers Compose du dépôt (compose.ec2.yaml reste propre au serveur).
    - scp -i "$EC2_SSH_KEY" compose.yaml compose.aws.yaml compose.https.yaml "$SSH_TARGET:$DEPLOY_DIR/"
    - scp -i "$EC2_SSH_KEY" frontend/nginx.https.conf "$SSH_TARGET:$DEPLOY_DIR/frontend/"
    # Le jeton du job permet au serveur de lire le registre GitLab.
    - printf '%s' "$CI_JOB_TOKEN" | ssh -i "$EC2_SSH_KEY" "$SSH_TARGET"
        "sudo docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY"
    - ssh -i "$EC2_SSH_KEY" "$SSH_TARGET"
        "DEPLOY_DIR=$DEPLOY_DIR BACKEND_IMAGE=$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA FRONTEND_IMAGE=$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA bash -s"
        < scripts/deploy_ec2.sh
