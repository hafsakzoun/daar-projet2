stages:
  - test
  - build

backend_tests:
  stage: test
  image: python:3.12-slim

  services:
    - name: postgres:16-alpine
      alias: db

  variables:
    POSTGRES_DB: "daar_test"
    POSTGRES_USER: "daar_test"
    POSTGRES_PASSWORD: "ci_test_only"

    DB_HOST: "db"
    DB_PORT: "5432"
    DB_NAME: "daar_test"
    DB_USER: "daar_test"
    DB_PASSWORD: "ci_test_only"
    DAAR_TEST_DB: "1"

  script:
    - cd backend
    - python -m pip install --no-cache-dir -r requirements-test.txt
    - python -m pytest tests/ -q

frontend_build:
  stage: build
  image: node:22-alpine

  script:
    - cd frontend
    - npm ci
    - npm run build
