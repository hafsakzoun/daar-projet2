stages:
  - test
  - build

backend_tests:
  stage: test
  image: python:3.12-slim
  script:
    - cd backend
    - python -m pip install --no-cache-dir -r requirements.txt
    - python -m pytest tests/ -q

frontend_build:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
