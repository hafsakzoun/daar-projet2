# Surcharge pour un serveur public (AWS EC2).
#
#   docker compose -f compose.yaml -f compose.aws.yaml up -d
#
# - l'application est publiee sur le port 80 de toutes les interfaces ;
# - l'API n'est plus exposee directement (elle passe par nginx) ;
# - un mot de passe PostgreSQL est obligatoire (fichier .env).
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}

  backend:
    ports: !reset []

  frontend:
    ports: !override
      - "80:80"
