# Surcharge pour un serveur public (AWS EC2).
#
#   docker compose -f compose.yaml -f compose.aws.yaml up -d
#
# - l'application est publiée sur le port 80 de toutes les interfaces ;
# - l'API n'est plus exposée directement (elle passe par nginx) ;
# - le mot de passe PostgreSQL doit être un secret propre au serveur
#   (DB_PASSWORD_SECRET dans .env) : le fichier de développement est refusé.
services:
  backend:
    ports: !reset []

  frontend:
    ports: !override
      - "80:80"

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET:?Definir DB_PASSWORD_SECRET dans .env (voir secrets/README.md)}
