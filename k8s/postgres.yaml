# PostgreSQL : StatefulSet avec son propre volume persistant.
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None   # service « headless » : nom DNS stable db.lisiere
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          # Journal limité : l'indexation écrit ~10 M de lignes.
          args: ["-c", "max_wal_size=256MB", "-c", "shared_buffers=128MB"]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: lisiere-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: lisiere-config, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: lisiere-db, key: DB_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
