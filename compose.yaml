services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daar}
      POSTGRES_USER: ${POSTGRES_USER:-daar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daar_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  corpus-init:
    build:
      context: ./backend
    environment: &db_environment
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-daar}
      DB_USER: ${POSTGRES_USER:-daar_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-daar_dev_only}
      CORPUS_URL: ${CORPUS_URL:-https://github.com/ouumm/daar-corpus-public/releases/download/corpus-v1/corpus-1700.tar.gz}
    volumes:
      - corpus:/data
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.services.auto_install"]
    restart: "no"

  index-init:
    build:
      context: ./backend
    environment:
      <<: *db_environment
    volumes:
      - corpus:/data
    networks:
      - db_net
    depends_on:
      corpus-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.services.auto_index"]
    restart: "no"

  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *db_environment
    volumes:
      - corpus:/data
    networks:
      - app_net
      - db_net
    depends_on:
      index-init:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    networks:
      - app_net
    depends_on:
      - backend

networks:
  app_net:
  db_net:

volumes:
  pgdata:
  corpus:
