# Une seule image backend, réutilisée par les trois services
# d'initialisation (corpus, index, graphe) et par l'API.
x-backend-image: &backend-image
  build:
    context: ./backend
  image: lisiere-backend:latest

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daar}
      POSTGRES_USER: ${POSTGRES_USER:-daar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daar_dev_only}
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  corpus-init:
    <<: *backend-image
    environment: &db_environment
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-daar}
      DB_USER: ${POSTGRES_USER:-daar_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-daar_dev_only}
      CORPUS_URL: ${CORPUS_URL:-https://github.com/ouumm/daar-corpus-public/releases/download/corpus-v1/corpus-1700.tar.gz}
    volumes:
      - corpus:/data
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.services.auto_install"]
    restart: "no"

  index-init:
    <<: *backend-image
    environment:
      <<: *db_environment
    volumes:
      - corpus:/data
    networks:
      - db_net
    depends_on:
      corpus-init:
        condition: service_completed_successfully
    command: ["python", "-m", "app.services.auto_index"]
    restart: "no"


  # Graphe de Jaccard + PageRank, stockes dans PostgreSQL
  # (tables book_similarities et book_scores). ~3 min au premier lancement.
  graph-init:
    <<: *backend-image
    environment:
      <<: *db_environment
      GRAPH_THRESHOLD: ${GRAPH_THRESHOLD:-0.20}
      GRAPH_MAX_DF: ${GRAPH_MAX_DF:-0.5}
      GRAPH_MIN_NEIGHBORS: ${GRAPH_MIN_NEIGHBORS:-5}
    networks:
      - db_net
    depends_on:
      index-init:
        condition: service_completed_successfully
    command: ["python", "-m", "scripts.build_graph"]
    restart: "no"

  backend:
    <<: *backend-image
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      <<: *db_environment
      # Charge les racines de l'index en memoire au demarrage (RegEx).
      PRELOAD_VOCABULARY: "1"
    volumes:
      # Textes des livres (lecture seule) pour la page de lecture.
      - corpus:/data:ro
    networks:
      - app_net
      - db_net
    depends_on:
      graph-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    image: lisiere-frontend:latest
    ports:
      # FRONTEND_BIND=0.0.0.0 pour ouvrir l'application aux autres
      # machines du réseau (démonstration sur plusieurs appareils).
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    networks:
      - app_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  app_net:
  db_net:

volumes:
  pgdata:
  corpus:
